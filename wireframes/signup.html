<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Pipeline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-wrap {
      width: 100%;
      max-width: 400px;
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-mark {
      width: 36px;
      height: 36px;
      background: #6366F1;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
    }
    .logo-name {
      font-size: 20px;
      font-weight: 700;
      color: #1f2937;
    }

    /* Card */
    .auth-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 36px 32px 32px;
    }
    .auth-card h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 6px;
    }
    .auth-card .subtitle {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 28px;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #4b5563;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1f2937;
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input:focus {
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }

    .btn-primary {
      width: 100%;
      background: #6366F1;
      color: #fff;
      border: none;
      padding: 11px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
      text-align: center;
      display: block;
      text-decoration: none;
    }
    .btn-primary:hover { background: #4f46e5; }

    .auth-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
    }
    .auth-footer a {
      color: #6366F1;
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="logo">
      <div class="logo-mark">P</div>
      <span class="logo-name">Pipeline</span>
    </div>

    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="subtitle">Start recording and verifying flows</p>

      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Abhishek Joseph" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>

      <button class="btn-primary" id="signupBtn">Create account</button>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('signupBtn').addEventListener('click', () => {
      window.location.href = 'dashboard.html';
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
